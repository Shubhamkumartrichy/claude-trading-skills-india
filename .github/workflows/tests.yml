name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests (stdlib only, no installs)
        run: python -m unittest discover -s tests -v
      - name: Smoke-test every calculator CLI
        run: |
          python skills/trading-costs/scripts/charges.py --segment delivery --buy 1800 --sell 1900 --qty 100 --broker all
          python skills/technical-analysis/scripts/ta.py summary --csv examples/sample_ohlcv.csv
          python skills/fno-options-analysis/scripts/options.py chain examples/sample_option_chain.csv --spot 23050
          python skills/fno-options-analysis/scripts/options.py expiries NIFTY --from 2026-11-01
          python skills/position-sizing/scripts/risk.py journal examples/sample_journal.csv
          python skills/indian-tax-for-traders/scripts/tax.py tradebook examples/sample_tradebook.csv
          python skills/market-regime/scripts/regime.py status --csv examples/sample_ohlcv.csv
          python skills/sector-rotation/scripts/sectors.py rotation --csv-dir tests/fixtures/sector_indices
          python skills/breakout-planner/scripts/breakout.py check --csv examples/sample_ohlcv.csv
          python skills/trading-discipline/scripts/discipline.py review examples/sample_journal.csv
          python skills/portfolio-review/scripts/portfolio.py review examples/sample_holdings.csv
          python skills/market-breadth/scripts/breadth.py status --csv-dir tests/fixtures/breadth_universe --benchmark-csv tests/fixtures/breadth_nifty.csv
          python skills/fii-dii-flows/scripts/flows.py participants --oi tests/fixtures/flows_participant_oi
          python skills/momentum-scanner/scripts/momentum.py scan --csv-dir tests/fixtures/momentum_universe --benchmark-csv tests/fixtures/momentum_nifty.csv
          python skills/results-season/scripts/results.py scan --events tests/fixtures/results_events.csv --csv-dir tests/fixtures --prefix results_
          python skills/pair-trading/scripts/pairs.py test BANKB BANKA --csv-dir tests/fixtures/pairs_stocks
          python skills/backtest-lab/scripts/backtest.py run --csv tests/fixtures/backtest_trend.csv --strategy sma-cross --params fast=10 slow=40
